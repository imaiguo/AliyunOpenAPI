services:
  AliyunDnsClient:
    image: httpdnsclient:1.0
    container_name: AliyunDnsClient
    restart: always
    command: ["python", "/opt/AliyunOpenAPI/src/RunClient.py"]
    environment:
      TZ: 'Asia/Shanghai'
      LANG: 'C.UTF-8'
    volumes:
      - './:/opt/AliyunOpenAPI'
    dns:
      - 223.5.5.5
      - 114.114.114.114